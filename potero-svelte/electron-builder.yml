# Electron Builder Configuration for Windows
# Build command: npm run electron:build:win

appId: "com.potero.app"
productName: "Potero"
copyright: "Copyright (c) 2024 Potero Team"

# Directory settings
directories:
  buildResources: "build-resources"
  output: "dist"

# Files to include in the app
files:
  - "electron/**/*"
  - "package.json"

# Extra resources (JAR, JRE, frontend, and GROBID) - copied to resources folder
extraResources:
  - from: "../potero-kmp/server/build/libs/potero-server.jar"
    to: "backend/potero-server.jar"
  - from: "jre-bundle/jre-win-x64"
    to: "jre"
  - from: "build"
    to: "frontend"
  - from: "grobid-bundle"
    to: "grobid"

# Windows configuration
win:
  target:
    - target: "dir"  # Unpacked directory (for testing)
      arch:
        - x64
  icon: "build-resources/icon.png"
  artifactName: "${productName}-${version}-portable.${ext}"
  # Disable code signing for cross-platform build
  signAndEditExecutable: false

# Enable asar packaging for app files
asar: true

# Compression settings
compression: "normal"

# Include ffmpeg for media support
electronDownload:
  customDir: ""

# Don't remove ffmpeg
removePackageScripts: false
